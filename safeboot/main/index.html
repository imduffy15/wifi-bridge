<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b26b00'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M6 13a14 14 0 0 1 20 0M10 17.5a8.5 8.5 0 0 1 12 0'/%3E%3C/g%3E%3Crect x='11' y='22' width='10' height='4' rx='1.2' fill='%23fff'/%3E%3C/svg%3E">
<title>Safeboot · WiFi Bridge</title>
<style>
:root{--bg:#f3f5f8;--fg:#18202b;--mu:#566170;--card:#fff;--bd:#d9dee5;--ac:#0b62c4;--acf:#fff;--ok:#1a7f37;--err:#c4291c;--warn:#8a5a00;--wbg:#fff4d6;--in:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1318;--fg:#e4e8ed;--mu:#9ba6b3;--card:#171f28;--bd:#2b3644;--ac:#5aa8ff;--acf:#04121f;--ok:#4ac262;--err:#ff7a6e;--warn:#e0a83a;--wbg:#3a2e12;--in:#10161d}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);overflow-wrap:anywhere}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
header svg{flex:none;color:var(--warn)}
h1{font-size:17px;margin:0;line-height:1.2}h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mu);font-size:13px}
main{max-width:620px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.banner{background:var(--wbg);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.banner p{margin:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:14px}dt{color:var(--mu)}dd{margin:0;text-align:right}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--fg);min-height:44px}
input[type=file]{padding:8px}
.ig{display:flex;gap:8px}.ig input{flex:1;min-width:0}
button{font:inherit;font-weight:600;padding:9px 16px;min-height:44px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--acf);cursor:pointer}
button.sec{background:transparent;color:var(--ac)}button:disabled{opacity:.5;cursor:default}
small{display:block;color:var(--mu);font-size:13px;margin-top:6px}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.ok{color:var(--ok)}.err{color:var(--err)}.mu{color:var(--mu)}
.or{margin:18px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><rect x="7" y="19" width="10" height="3" rx="1"/></svg>
<div><h1 id="hN">WiFi Bridge</h1><div class="sub">Safeboot · firmware installer</div></div>
</header>
<main>
<div class="banner" role="status"><p><b>The bridge is paused.</b> This small safeboot firmware installs WiFi Bridge updates. <span id="ret"></span></p></div>
<div class="card"><h2>Install firmware</h2>
<label for="f">Firmware file</label>
<div class="ig"><input type="file" id="f" accept=".bin,application/octet-stream"><button id="u">Install</button></div>
<small>Use <b>wifi-bridge-&lt;version&gt;.ota.bin</b>. Your settings are kept.</small>
<form id="uf" class="or"><label for="url">Or install from a URL</label>
<div class="ig"><input id="url" type="url" inputmode="url" placeholder="https://…/wifi-bridge-0.1.0.ota.bin" required pattern="https?://.+" spellcheck="false" autocapitalize="off"><button id="ub">Install</button></div></form>
<div id="p" hidden><div class="bar"><i id="pb"></i></div><small id="pt" aria-live="polite"></small></div>
</div>
<div class="card"><h2>Device</h2><dl id="info"><dt>Status</dt><dd>Loading…</dd></dl>
<div style="margin-top:14px"><button class="sec" id="back" hidden>Leave safeboot and start WiFi Bridge</button></div></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';
let S=null,busy=false;
async function api(p,body){
  const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),8000);
  const o={cache:'no-store',credentials:'same-origin',signal:ac.signal};
  if(body!==undefined){o.method='POST';o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(body)}
  try{const r=await fetch(p,o);const j=await r.json();
    if(!r.ok||j.ok===false)throw new Error(j.error||'HTTP '+r.status);return j}
  finally{clearTimeout(timer)}
}
const prog=(pc,t,err)=>{$('p').hidden=false;$('pb').style.width=pc+'%';$('pb').style.background=err?'var(--err)':'';$('pt').textContent=t;$('pt').className=err?'err':''};
const lock=b=>{busy=b;['f','u','url','ub','back'].forEach(i=>$(i).disabled=b)};
async function status(){
  try{S=await api('api/status')}catch(e){return}
  const d=S.device,w=S.wifi;
  $('hN').textContent=d.name||d.hostname;document.title='Safeboot · '+(d.name||d.hostname);
  $('info').innerHTML=[['Installed firmware',d.firmware_version?'WiFi Bridge '+esc(d.firmware_version):'<span class="err">none</span>'],['Safeboot',esc(d.safeboot_version)],
    ['Wi-Fi',w.state=='connected'?'<span class="ok">'+esc(w.ssid)+'</span> · '+esc(w.ip):esc(w.state)],w.ap_active&&['Access point',esc(w.ap_ssid)+' · 192.168.4.1'],
    ['Ethernet',esc(S.ethernet.state.replace('_',' '))]].filter(Boolean).map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('');
  $('back').hidden=!d.firmware_version;
  $('ret').textContent=d.firmware_version?'If you close this page without installing, WiFi Bridge starts again by itself after 10 minutes.':'No firmware is installed yet: install it below.';
}
async function header(f){
  const b=new Uint8Array(await f.slice(0,112).arrayBuffer()),s=(o,n)=>new TextDecoder().decode(b.slice(o,o+n)).replace(/\0.*$/s,'');
  return b[0]==0xE9&&b.length>=112?{name:s(80,32),version:s(48,32)}:null;
}
function uncertain(message){prog(0,message+' Keep the bridge powered on. Reload to check its firmware before trying again.',1);const a=document.createElement('a');a.href='./';a.textContent=' Reload page';$('pt').append(a)}
async function done(message='Installed. Starting WiFi Bridge…'){
  prog(100,message);
  await sleep(4000);
  for(let i=0;i<90;i++){try{const j=await api('api/status');if(j.mode=='bridge'||j.mode=='setup'){location.replace('./');return}}catch(e){}await sleep(2000)}
  uncertain('WiFi Bridge did not answer yet.');
}
$('u').onclick=async()=>{
  const f=$('f').files[0];if(!f)return prog(0,'Choose the firmware file first.',1);
  let h;try{h=await header(f)}catch(e){return prog(0,'Could not read this file. Choose it again.',1)}
  if(!h)return prog(0,'This isn’t ESP32 firmware. Use the .ota.bin file (not the .factory.bin).',1);
  if(h.name=='wifi-bridge-safeboot')return prog(0,'This is the safeboot firmware itself. Install it from WiFi Bridge’s Firmware tab instead.',1);
  if(h.name!='wifi-bridge')return prog(0,'This file is “'+h.name+'”, not WiFi Bridge firmware.',1);
  lock(true);prog(0,'Uploading WiFi Bridge '+h.version+'…');
  const x=new XMLHttpRequest();x.open('POST','api/ota/upload');x.timeout=180000;x.setRequestHeader('Content-Type','application/octet-stream');
  x.upload.onprogress=e=>{if(e.lengthComputable){const p=e.loaded/e.total*100;prog(p,p>=100?'Checking the image…':`Uploading… ${p|0}% (${kb(e.loaded)} of ${kb(e.total)})`)}};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}
    if(x.status==200&&j.ok===true)done();else{lock(false);prog(100,'Not installed: '+(j.error||'HTTP '+x.status),1)}};
  x.onerror=x.ontimeout=x.onabort=()=>uncertain('The upload connection was interrupted; the result is unknown.');
  x.send(f);
};
$('uf').onsubmit=async e=>{e.preventDefault();if(!e.target.reportValidity())return;
  lock(true);prog(0,'Starting download…');
  try{await api('api/ota/url',{url:$('url').value.trim()})}catch(x){return uncertain('Could not confirm the download started: '+x.message+'.')}
  let heard=Date.now(),advanced=heard,bytes=-1;
  for(;;){await sleep(1000);let r;try{r=await api('api/ota');heard=Date.now()}catch(x){
      if(Date.now()-heard>60000)return uncertain('The bridge stopped reporting update progress.');
      prog(0,'Connection interrupted. Waiting for the bridge…');continue}
    if(r.bytes!==bytes){bytes=r.bytes;advanced=Date.now()}
    if(Date.now()-advanced>180000)return uncertain('The update has not reported progress for three minutes.');
    if(r.state=='running')prog(r.progress,'Downloading… '+r.progress+'%'+(r.total?` (${kb(r.bytes)} of ${kb(r.total)})`:''));
    else if(r.state=='done')return done();
    else if(r.state=='error'){lock(false);return prog(100,'Not installed: '+(r.error||'unknown error'),1)}
    else{return uncertain('The update status was reset, possibly by a restart.')}}
};
$('back').onclick=async()=>{lock(true);try{await api('api/reboot',{target:'normal'});done('Starting WiFi Bridge…')}catch(e){lock(false);prog(0,e.message,1)}};
status();setInterval(()=>{if(!busy)status()},5000);
</script>
</body>
</html>
