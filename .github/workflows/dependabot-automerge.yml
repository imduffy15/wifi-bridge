#
# Merges Dependabot's grouped minor/patch pull requests after CI passes on them. Major updates are
# opened one per pull request (see .github/dependabot.yml) and are left for review.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      contains(github.event.workflow_run.head_branch, '-minor-patch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,headRefOid \
                 --jq ".[] | select(.headRefOid == \"$SHA\") | .number")
          if [ -z "$pr" ]; then
            echo "No open pull request for $BRANCH at $SHA (already merged, or updated since CI ran)."
            exit 0
          fi
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch
          echo "Merged #$pr" >> "$GITHUB_STEP_SUMMARY"
